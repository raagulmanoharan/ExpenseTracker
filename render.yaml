services:
  - type: web
    name: whatsapp-expense-tracker
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: NODE_ENV
        value: production
      - key: TEMPLATE_SID_SMART_NUDGE
        sync: false
      - key: TEMPLATE_SID_MORNING_FOLLOWUP
        sync: false
      - key: TEMPLATE_SID_PRE_STATEMENT
        sync: false
      - key: TEMPLATE_SID_LAPSE_NUDGE
        sync: false
      - key: TEMPLATE_SID_DAILY_NUDGE
        sync: false
      - key: TEMPLATE_SID_FRIDAY_CHART
        sync: false
      - key: TEMPLATE_SID_FRIDAY_DIGEST
        sync: false
      - key: TEMPLATE_SID_OVERSPEND_ALERT
        sync: false
      - key: TEMPLATE_SID_EVENING_CHECKIN
        sync: false
